    <div id="toastLayer" class="toast-layer" aria-live="assertive" aria-relevant="additions text" v-cloak>
      <div v-for="toast in toasts" :key="toast.id" class="toast" :class="['toast-' + toast.type, { 'toast-exit': toast.leaving }]" :data-toast-id="toast.id" :role="toast.role">
        <button type="button" class="toast-close" aria-label="Fermer la notification" @click="dismissToast(toast.id)">
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
        <p :class="toast.toneClass">
          <svg v-if="toast.type === 'success'" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 6L9 17l-5-5"></path>
          </svg>
          <svg v-else width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          {{ toast.message }}
        </p>
      </div>
    </div>
    <!-- CONFIRM-1 : confirmation dessinée par l'appli, jamais une fenêtre du navigateur. -->
    <dialog id="confirmDialog" class="confirm-dialog" aria-labelledby="confirmDialogMessage" @cancel.prevent="answerConfirm(false)" @click.self="answerConfirm(false)" v-cloak>
      <div class="confirm-dialog-body">
        <p id="confirmDialogMessage" class="confirm-dialog-message">{{ message }}</p>
        <div class="confirm-dialog-actions">
          <button id="confirmDialogCancel" type="button" class="button-secondary" @click="answerConfirm(false)">{{ cancelLabel }}</button>
          <button id="confirmDialogConfirm" type="button" :class="danger ? 'confirm-dialog-danger' : ''" @click="answerConfirm(true)">{{ confirmLabel }}</button>
        </div>
      </div>
    </dialog>
