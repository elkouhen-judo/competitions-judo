    <header id="appHeader" class="topbar" :class="{ hidden: !showHeader }" v-cloak>
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">
          <svg class="brand-logo-mark" viewBox="0 0 64 64" focusable="false">
            <rect class="brand-logo-field" x="6" y="6" width="52" height="52" rx="10"></rect>
            <path class="brand-logo-tatami" d="M18 18h28M18 30h28M18 42h28M18 18v24M32 18v24M46 18v24"></path>
            <path class="brand-logo-belt" d="M13 47h38"></path>
            <text x="32" y="38" text-anchor="middle">記</text>
          </svg>
        </div>
        <div class="brand-copy">
          <h1>Kiroku - 記録</h1>
          <p class="subtitle">Suivi de compétitions</p>
        </div>
      </div>
      <div class="user-actions">
        <div v-if="showOfflineStatus" class="offline-status" role="status">{{ offlineStatusText }}</div>
        <!-- NAV-4 : nom et un seul rôle ; les autres espaces et la déconnexion sont dans le menu. -->
        <details id="accountMenu" class="page-menu account-menu">
          <summary id="userInfo" class="user-pill" aria-label="Menu du compte">
            <strong>{{ userName }}</strong>
            <span class="user-pill-role">{{ roleLabel }}</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </summary>
          <div class="page-menu-list" role="menu">
            <button v-if="showPersonalSpaceLink" type="button" role="menuitem" @click="openPersonalSpace()">Mon espace</button>
            <button v-if="showFamilyLink" type="button" role="menuitem" @click="openFamilySpace()">Ma famille</button>
            <button v-if="showAdminLink" type="button" role="menuitem" @click="openAccessManagement()">Gestion des accès</button>
            <a id="privacyLink" href="/confidentialite" role="menuitem">Données personnelles</a>
            <button id="logoutButton" type="button" role="menuitem" @click="logoutUser()">Se déconnecter</button>
          </div>
        </details>
      </div>
    </header>
