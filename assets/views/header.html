    <header id="appHeader" class="topbar" :class="{ hidden: !showHeader }" v-cloak>
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">
          <svg class="brand-logo-mark" viewBox="0 0 64 64" focusable="false">
            <rect class="brand-logo-field" x="6" y="6" width="52" height="52" rx="10"></rect>
            <path class="brand-logo-tatami" d="M18 18h28M18 30h28M18 42h28M18 18v24M32 18v24M46 18v24"></path>
            <path class="brand-logo-belt" d="M13 47h38"></path>
            <text x="32" y="38" text-anchor="middle">記</text>
          </svg>
        </div>
        <div class="brand-copy">
          <h1>Kiroku - 記録</h1>
          <p class="subtitle">Suivi de compétitions</p>
        </div>
      </div>
      <div class="user-actions">
        <div v-if="showOfflineStatus" class="offline-status" role="status">{{ offlineStatusText }}</div>
        <div id="userInfo" class="user-pill"><strong>{{ userName }}</strong> - {{ roleLabel }}</div>
        <button id="logoutButton" type="button" class="button-secondary logout-button" @click="logoutUser()" aria-label="Déconnexion" title="Déconnexion">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <path d="M16 17l5-5-5-5"></path>
            <path d="M21 12H9"></path>
          </svg>
        </button>
      </div>
    </header>
