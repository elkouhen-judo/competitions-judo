    <section id="combatFormView" class="panel hidden" v-cloak>
      <div class="panel-header">
        <div>
          <h2 id="combatFormTitle">{{ combatFormTitle }}</h2>
          <p id="combatFormSubtitle" class="subtitle">{{ combatFormSubtitle }}</p>
        </div>
      </div>
      <div class="panel-body">
        <input type="hidden" id="combat_id" v-model="combatForm.combatId">

        <div class="segmented-control combat-entry-mode" role="group" aria-label="Mode de saisie du combat">
          <button class="button-secondary" type="button" :class="{ 'segment-active': combatQuickMode }" @click="setCombatQuickMode(true)">Saisie rapide</button>
          <button class="button-secondary" type="button" :class="{ 'segment-active': !combatQuickMode }" @click="setCombatQuickMode(false)">Détails</button>
        </div>

        <div class="form-grid">
          <div>
            <label for="combat_adversaire">Adversaire</label>
            <input type="text" id="combat_adversaire" v-model.trim="combatForm.opponent">
          </div>

          <div v-show="!combatQuickMode">
            <label for="combat_garde_adversaire">Garde de l'adversaire</label>
            <select id="combat_garde_adversaire" v-model="combatForm.opponentStance">
              <option value="">Non spécifié</option>
              <option value="Droitier">Droitier</option>
              <option value="Gaucher">Gaucher</option>
            </select>
            <p class="field-hint">Alimente les métriques même garde / garde opposée.</p>
          </div>

          <div>
            <label for="combat_resultat">Résultat</label>
            <select id="combat_resultat" v-model="combatForm.result" @change="syncCombatDecisionVisibility(true)">
              <option value="">Choisir</option>
              <option value="Victoire">Victoire</option>
              <option value="Défaite">Défaite</option>
              <option value="Egalité">Egalité</option>
            </select>
            <div class="quick-result-row" role="group" aria-label="Résultat rapide">
              <button class="button-secondary" type="button" @click="setCombatQuickResult('Victoire')">Victoire</button>
              <button class="button-secondary" type="button" @click="setCombatQuickResult('Défaite')">Défaite</button>
              <button class="button-secondary" type="button" @click="setCombatQuickResult('Egalité')">Égalité</button>
            </div>
          </div>

          <div id="combatDecisionBlock" :class="{ hidden: !showCombatDecisionBlock }">
            <label for="combat_type_victoire">Type de décision</label>
            <select id="combat_type_victoire" v-model="combatForm.victoryType">
              <option value="">Non spécifié</option>
              <option v-for="option in combatDecisionOptions" :key="option" :value="option">{{ option }}</option>
            </select>
            <p class="field-hint">Alimente les répartitions par décision et les défaites hansoku-make.</p>
          </div>

          <div v-show="!combatQuickMode" class="full-row">
            <label>Prises marquées</label>
            <div class="combat-score-rows">
              <div v-for="(score, index) in combatForm.scores" :key="index" class="combat-score-row">
                <span class="combat-score-row-title">Prise {{ index + 1 }}</span>
                <select v-model="score.category" @change="onCombatScoreCategoryChange(index)">
                  <option value="">Catégorie</option>
                  <option value="Tachi-waza">Tachi-waza</option>
                  <option value="Ne-waza">Ne-waza</option>
                </select>
                <select v-if="score.category === 'Tachi-waza'" v-model="score.technique">
                  <option value="">Nom de la prise</option>
                  <option v-for="technique in tachiWazaTechniques" :key="technique" :value="technique">{{ technique }}</option>
                </select>
                <select v-else-if="score.category === 'Ne-waza'" v-model="score.neWazaType">
                  <option value="">Type de prise</option>
                  <option value="Clé">Clé</option>
                  <option value="Étranglement">Étranglement</option>
                  <option value="Osaekomi">Osaekomi</option>
                </select>
                <select v-else disabled>
                  <option value="">Choisir une catégorie</option>
                </select>
                <select v-model="score.value">
                  <option value="">Valeur</option>
                  <option value="Ippon">Ippon</option>
                  <option value="Waza-ari">Waza-ari</option>
                  <option value="Yuko">Yuko</option>
                </select>
                <button class="button-danger" type="button" @click="removeCombatScoreRow(index)">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                  Retirer cette prise
                </button>
              </div>
            </div>
            <button class="button-secondary" type="button" @click="addCombatScoreRow()">+ Ajouter une prise</button>
            <p class="field-hint">Alimente les métriques Tachi-waza et Ne-waza.</p>
          </div>

          <div v-show="!combatQuickMode" class="full-row">
            <label for="combat_deroule">Déroulé du combat</label>
            <textarea id="combat_deroule" rows="3" placeholder="Racontez le déroulé du combat (prises, temps forts...)" v-model.trim="combatForm.notes"></textarea>
          </div>
        </div>

        <div class="form-actions mobile-action-bar">
          <button v-if="combatQuickMode" class="button-secondary" type="button" @click="setCombatQuickMode(false)">
            Ajouter les détails
          </button>
          <button class="button-secondary" type="button" @click="cancelCombatForm()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18"></path><path d="M6 6l12 12"></path></svg>
            Annuler
          </button>
          <button id="saveCombatButton" type="button" :disabled="isSubmitting" @click="saveCombat()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
            <span id="saveCombatButtonText">{{ saveCombatButtonText }}</span>
          </button>
        </div>
      </div>
    </section>
