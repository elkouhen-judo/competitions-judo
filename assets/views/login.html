    <section id="loginView" class="panel hidden" v-cloak>
      <div class="login-container">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
        <h2>Connexion requise</h2>
        <p id="loginText">{{ text }}</p>
        <div id="oauthLoginOptions" class="login-options" v-show="showOAuth">
          <button id="googleLoginButton" type="button" class="button-google" @click="startGoogleLogin()">
            <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
              <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"></path>
              <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.33-1.58-5.04-3.7H.94v2.33A9 9 0 0 0 9 18z"></path>
              <path fill="#FBBC05" d="M3.96 10.72A5.41 5.41 0 0 1 3.68 9c0-.6.1-1.18.28-1.72V4.95H.94A9 9 0 0 0 0 9c0 1.45.34 2.82.94 4.05l3.02-2.33z"></path>
              <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.9 11.43 0 9 0A9 9 0 0 0 .94 4.95l3.02 2.33C4.67 5.16 6.66 3.58 9 3.58z"></path>
            </svg>
            Se connecter avec Google
          </button>
        </div>
        <p id="loginHint" class="subtitle" v-show="showHint">{{ hint }}</p>
        <form id="profileRegistrationForm" class="login-form" v-show="showRegistration" @submit.prevent="submitProfileRegistration()">
          <label for="registrationPrenom">Prénom</label>
          <input id="registrationPrenom" type="text" autocomplete="given-name" v-model.trim="registration.firstName">
          <label for="registrationNom">Nom</label>
          <input id="registrationNom" type="text" autocomplete="family-name" v-model.trim="registration.lastName">
          <button type="submit">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21a8 8 0 0 0-16 0"></path><circle cx="12" cy="7" r="4"></circle><path d="M19 8v6"></path><path d="M16 11h6"></path></svg>
            Créer mon profil
          </button>
        </form>
      </div>
    </section>
