    <section id="ffjudoAgendaView" class="panel hidden" v-cloak>
      <!-- AGD-001 / NAV-6 : l'agenda est un onglet du coach, sans flèche de retour. -->
      <div class="dash-hero">
        <nav class="mode-tabs coach-sub-tabs" aria-label="Navigation coach">
          <button type="button" class="mode-tab" @click="showCoachHome()"><svg class="mode-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"></path></svg><span>Accueil</span></button>
          <button type="button" class="mode-tab" @click="showCoachCompetitions()"><svg class="mode-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"></path></svg><span>Compétitions</span></button>
          <button type="button" class="mode-tab" @click="showCoachJudoka()"><svg class="mode-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"></path></svg><span>Judokas</span></button>
          <button type="button" class="mode-tab" @click="showCoachDashboard()"><svg class="mode-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg><span>Statistiques</span></button>
          <button type="button" class="mode-tab mode-tab-active" aria-current="page"><svg class="mode-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg><span>Agenda</span></button>
        </nav>
      </div>
      <div class="panel-header page-header">
        <div class="page-title">
          <h2>Agenda FFJDA</h2>
          <p id="ffjudoAgendaLastSync" class="subtitle">{{ lastSyncLabel }}</p>
        </div>
      </div>
      <div class="panel-body">
        <!-- AGD : filtres appliqués dans le navigateur sur les événements à venir. -->
        <!-- AGD-013 : cocher plusieurs UV garde les séances qui les proposent toutes. -->
        <div v-if="hasEvents" class="agenda-uv-filter">
          <span id="ffjudoAgendaUvLabel" class="agenda-uv-label">Passages d'UV</span>
          <div class="choice-chips" role="group" aria-labelledby="ffjudoAgendaUvLabel">
            <button v-for="uv in uvOptions" :key="uv" :id="'ffjudoAgenda' + uv.replace('UV', 'Uv')" type="button" :class="['choice-chip', { 'choice-active': filters.uvs.includes(uv) }]" :aria-pressed="filters.uvs.includes(uv) ? 'true' : 'false'" :disabled="isLoading" @click="toggleFfjudoAgendaUv(uv)">{{ uv }}</button>
          </div>
        </div>
        <div v-if="hasEvents" class="form-grid agenda-filters">
          <div>
            <label for="ffjudoAgendaLigue">Ligue</label>
            <select id="ffjudoAgendaLigue" v-model="filters.ligue" :disabled="isLoading">
              <option value="">Toutes les ligues</option>
              <option v-for="option in ligueOptions" :key="option.value" :value="option.value">{{ option.label }}</option>
            </select>
          </div>
          <div>
            <label for="ffjudoAgendaType">Type</label>
            <select id="ffjudoAgendaType" v-model="filters.type" :disabled="isLoading">
              <option value="">Tous les types</option>
              <option v-for="option in typeOptions" :key="option.value" :value="option.value">{{ option.label }}</option>
            </select>
          </div>
          <div>
            <label for="ffjudoAgendaMonth">Mois</label>
            <select id="ffjudoAgendaMonth" v-model="filters.month" :disabled="isLoading">
              <option value="">Tous les mois</option>
              <option v-for="option in monthOptions" :key="option.value" :value="option.value">{{ option.label }}</option>
            </select>
          </div>
        </div>

        <div v-if="isLoading" class="dashboard-loading-state" aria-busy="true">
          <span class="dashboard-loading-label">Chargement de l'agenda…</span>
          <div v-for="index in 3" :key="index" class="sk-card">
            <div class="sk-line sk-meta"></div>
            <div class="sk-line sk-title"></div>
          </div>
        </div>
        <div v-else-if="loadError" class="status-banner status-banner-warning dashboard-load-error error-state" role="status">
          <span>{{ loadError }}</span>
          <button v-if="canRetry" class="button-secondary compact-button" type="button" @click="retryFfjudoAgenda()">Réessayer</button>
        </div>
        <div v-else-if="!hasEvents" class="empty-state">Aucun événement à venir.</div>
        <div v-else-if="!monthGroups.length" class="empty-state agenda-no-match">
          <p>Aucun événement pour ces filtres.</p>
          <button class="button-secondary compact-button" type="button" @click="clearFfjudoAgendaFilters()">Effacer les filtres</button>
        </div>
        <template v-else>
          <section v-for="group in monthGroups" :key="group.key" class="agenda-month" :aria-label="group.label">
            <h3 class="agenda-month-title">{{ group.label }}</h3>
            <div class="list">
              <article v-for="event in group.events" :key="event.eventKey" class="card agenda-card">
                <p class="agenda-card-date">{{ event.dateLabel }}</p>
                <p v-if="event.uvLabel" class="agenda-card-uvs">{{ event.uvLabel }}</p>
                <p class="card-title">{{ event.titre }}</p>
                <div class="card-meta">
                  <p v-if="event.placeLabel" class="agenda-card-line">{{ event.placeLabel }}</p>
                  <p v-if="event.ownerLabel" class="agenda-card-line">{{ event.ownerLabel }}</p>
                  <p v-if="event.closingLabel" :class="['agenda-card-line', event.isClosed ? 'agenda-card-closed' : 'agenda-card-closing']">{{ event.closingLabel }}</p>
                </div>
                <div class="agenda-card-actions">
                  <button v-if="event.canCreateCompetition" class="button-secondary compact-button" type="button" @click="createCompetitionFromEvent(event.eventKey)">Créer la compétition</button>
                  <a class="agenda-card-link" :href="event.sourceUrl" target="_blank" rel="noopener">Voir sur ffjudo.com <span aria-hidden="true">↗</span></a>
                </div>
              </article>
            </div>
          </section>
        </template>
        <!-- AGD-016 : passages de grade sans UV reconnue, que le filtre UV ne garde pas. -->
        <template v-if="!isLoading && !loadError && unlabeledGradeCount">
          <section v-if="unlabeledGradeCards.length" id="ffjudoAgendaUnlabeledGrades" class="agenda-month" aria-label="UV non renseignées">
            <h3 class="agenda-month-title">UV non renseignées</h3>
            <div class="list">
              <article v-for="event in unlabeledGradeCards" :key="event.eventKey" class="card agenda-card">
                <p class="agenda-card-date">{{ event.dateLabel }}</p>
                <p class="card-title">{{ event.titre }}</p>
                <div class="card-meta">
                  <p v-if="event.placeLabel" class="agenda-card-line">{{ event.placeLabel }}</p>
                  <p v-if="event.ownerLabel" class="agenda-card-line">{{ event.ownerLabel }}</p>
                  <p v-if="event.closingLabel" :class="['agenda-card-line', event.isClosed ? 'agenda-card-closed' : 'agenda-card-closing']">{{ event.closingLabel }}</p>
                </div>
                <a class="agenda-card-link" :href="event.sourceUrl" target="_blank" rel="noopener">Voir sur ffjudo.com <span aria-hidden="true">↗</span></a>
              </article>
            </div>
          </section>
          <div v-else id="ffjudoAgendaUnlabeledHint" class="agenda-unlabeled">
            <p>{{ unlabeledGradeCount }} passage{{ unlabeledGradeCount > 1 ? 's' : '' }} de grade sans UV renseignée</p>
            <button class="button-secondary compact-button" type="button" @click="showUnlabeledGradeSessions()">Afficher</button>
          </div>
        </template>
      </div>
    </section>
