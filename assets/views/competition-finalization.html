    <section id="competitionFinalizationView" class="panel hidden" v-cloak>
      <div class="panel-header">
        <div>
          <h2>Finaliser la compétition</h2>
          <p id="competitionFinalizationSubtitle" class="subtitle">{{ finalizationSubtitle }}</p>
        </div>
      </div>
      <div class="panel-body">
        <input type="hidden" id="finalization_competition_id" v-model="finalizationForm.competitionId">

        <label for="finalization_classement">Classement / résultat</label>
        <select id="finalization_classement" v-model="finalizationForm.result">
          <option value="">Non renseigné</option>
          <option value="1er">1er</option>
          <option value="2e">2e</option>
          <option value="3e">3e</option>
          <option value="5e">5e</option>
          <option value="7e">7e</option>
          <option value="Non classé">Non classé</option>
        </select>

        <div class="form-actions mobile-action-bar">
          <button class="button-secondary" type="button" @click="cancelCompetitionFinalizationForm()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18"></path><path d="M6 6l12 12"></path></svg>
            Annuler
          </button>
          <button type="button" :disabled="isSubmitting" @click="finalizeCompetition()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
            Enregistrer le classement
          </button>
        </div>
      </div>
    </section>
