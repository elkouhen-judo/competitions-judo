sonar.projectKey=kiroku-competitions-judo
sonar.projectName=Kiroku

sonar.sources=api,assets,core,scripts,utils
sonar.tests=tests
sonar.sourceEncoding=UTF-8

sonar.exclusions=**/node_modules/**,**/assets/dist/**,**/core-dist/**,**/vendor/**,supabase/migrations/**,**/*.min.js
sonar.test.inclusions=tests/**/*.test.js

# Root tsconfig.json targets Vercel's implicit build step (TS 5.5+ options the
# bundled Sonar TS analyzer can't parse) and isn't used for local typechecking.
# jsconfig.json is the config actually used by `npm run typecheck`.
sonar.typescript.tsconfigPaths=jsconfig.json
